# 1. Créer l'arborescence de dossiers
mkdir -p .github/workflows

# 2. Créer le fichier avec le contenu YAML
cat << 'EOF' > .github/workflows/alert.yml
name: Check Economic Calendar

on:
  schedule:
    - cron: '*/10 * * * 1-5'
  workflow_dispatch:

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alert Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_alert_eurusd.py
EOF

# 3. Pousser sur GitHub
git add .
git commit -m "Ajout du workflow GitHub Actions"
git push origin main

